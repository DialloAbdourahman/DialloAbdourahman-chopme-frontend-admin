name: Deploy React App to S3

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'chopme-admin-prod-website' || 'chopme-admin-dev-website' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          CI: false
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL }}
          VITE_WEB_SOCKET_URL: ${{ vars.VITE_WEB_SOCKET_URL }}
          VITE_ACCESS_TOKEN_KEY: ${{ vars.VITE_ACCESS_TOKEN_KEY }}
          VITE_REFRESH_TOKEN_KEY: ${{ vars.VITE_REFRESH_TOKEN_KEY }}
          VITE_GOOGLE_PLACE_API_KEY: ${{ vars.VITE_GOOGLE_PLACE_API_KEY }}
          VITE_PUBLIC_S3_PREFIX: ${{ vars.VITE_PUBLIC_S3_PREFIX }}
          VITE_ROUND_TO_NEAREST: ${{ vars.VITE_ROUND_TO_NEAREST }}
          MAX_RESTAURANT_IMAGES: ${{ vars.MAX_RESTAURANT_IMAGES }}
          MAX_RESTAURANT_IMAGE_SIZE_IN_MB: ${{ vars.MAX_RESTAURANT_IMAGE_SIZE_IN_MB }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
          VITE_CLIENT_WEBSITE_URL: ${{ vars.VITE_CLIENT_WEBSITE_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }} --delete
